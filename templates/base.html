<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}LearnCraft Spanish{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="{{ url_for('index') }}" class="logo-link">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="LearnCraft Spanish" class="logo-img" />
      </a>
      <nav>
        <a href="{{ url_for('student_form') }}">Student</a>
        <a href="{{ url_for('coach_form') }}">Coach</a>
        <a href="{{ url_for('admin') }}">Admin</a>
        {% if current_user %}
        <span class="nav-user">{{ current_user }}</span>
        <a href="{{ url_for('logout') }}" class="nav-logout">Log out</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
